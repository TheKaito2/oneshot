name: OneShot
options:
  bundleIdPrefix: com.krist.hackday
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.4
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 97BS2K8UQ2
    CODE_SIGN_STYLE: Automatic
targets:
  OneShot:
    type: application
    platform: iOS
    sources:
      - path: OneShot
        excludes:
          - "*.xcconfig"
    configFiles:
      Debug: OneShot/Config.xcconfig
      Release: OneShot/Config.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: OneShot/Info.plist
      properties:
        CFBundleDisplayName: OneShot
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, th]
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: OneShot uses the camera to recognise the items on the counter.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # From OneShot/Config.xcconfig (+ the gitignored Secrets.xcconfig); empty = a build without accounts.
        SupabaseHost: $(SUPABASE_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UIAppFonts:
          - LINESeedSansTH_A_Rg.ttf
          - LINESeedSansTH_A_Bd.ttf
          - LINESeedSansTH_A_XBd.ttf
          - LINESeedSansTH_A_He.ttf
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krist.hackday.oneshot
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        COREML_CODEGEN_LANGUAGE: None
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  OneShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OneShotTests
    dependencies:
      - target: OneShot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  OneShotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OneShotUITests
    dependencies:
      - target: OneShot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OneShot
schemes:
  OneShotTour:
    build:
      targets:
        OneShot: all
        OneShotUITests: [test]
    test:
      config: Release
      targets:
        - OneShotUITests
  OneShot:
    build:
      targets:
        OneShot: all
        OneShotTests: [test]
    run:
      config: Release
      # Metal API Validation (on by default when Xcode runs the app) asserts inside Apple's MPSGraph while Core ML
      # runs the detector, aborting the app (SIGABRT, MTLDebugDevice newResidencySet, 19 Oct). Off the debugger it
      # never runs, so it only ever broke Xcode launches.
      enableGPUValidationMode: disabled
      enableGPUFrameCaptureMode: disabled
    test:
      targets:
        - OneShotTests
